<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없어요 · 시험 준비 노트</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; color: #2a2620; font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif; text-align: center; }
    main { padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: #7a7265; }
    a { display: inline-block; padding: 10px 20px; border-radius: 999px; background: #2f4f6f; color: #fff; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) { body { background: #1a1916; color: #ece7dc; } p { color: #a39c8e; } }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 없는 페이지예요.</p>
    <a id="home" href="/">시험 선택으로 가기</a>
  </main>
  <script>
    // GitHub Pages 프로젝트 주소(/저장소이름/…)에서도 처음 화면으로 가도록
    var seg = location.pathname.split('/')[1] || '';
    document.getElementById('home').href = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
  </script>
</body>
</html>
